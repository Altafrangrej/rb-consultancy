<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RB Consultancy | Claim Facilitation & Dispute Resolution</title>
  <meta name="description" content="Independent insurance claim facilitation, rejected claims recovery, IRDAI appeals, and MSME resolution led by Altaf Rangrej in Jalgaon, Maharashtra.">
  <meta name="theme-color" content="#0B2F4A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0B2F4A;
      --navy-light: #123F5E;
      --gold: #D4A017;
      --gold-light: #F5E7B8;
      --green: #25D366;
      --dark-green: #106634;
      --white: #FFFFFF;
      --light: #F4F8FB;
      --section-alt: #EBF2F8;
      --text: #263746;
      --muted: #556677;
      --line: #D0DCE6;
      --shadow: 0 14px 40px rgba(11,47,74,0.09);
      --radius: 14px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--white);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      line-height: 1.65;
    }
    
    .marathi-text {
      font-family: 'Hind', sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    section { scroll-margin-top: 88px; }

    .wrap { width: min(calc(100% - 36px), var(--max)); margin: auto; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gold); font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.12em; font-size: 12px; margin-bottom: 12px;
    }
    .eyebrow:before { content: ""; width: 28px; height: 2px; background: var(--gold); }
    
    h1, h2, h3 { color: var(--navy); margin: 0; line-height: 1.15; }
    h1 { font-size: clamp(26px, 3.8vw, 42px); letter-spacing: -0.035em; }
    h2 { font-size: clamp(24px, 3.2vw, 38px); letter-spacing: -0.025em; }
    p { margin: 0; color: var(--muted); }

    /* Header & Vector-Style Logo Component */
    .header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .nav { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    
    .brand-logo-vector {
      display: flex; align-items: center; gap: 12px; text-decoration: none; background: #ffffff;
    }
    .logo-circle {
      width: 44px; height: 44px; border-radius: 50%; background: var(--navy);
      display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(11,47,74,0.2);
    }
    .logo-circle-text {
      color: #ffffff; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; font-family: 'Poppins', sans-serif;
    }
    .logo-checkmark {
      position: absolute; top: 2px; right: 2px; width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 10px; font-weight: 900;
    }
    .logo-texts {
      display: flex; flex-direction: column; justify-content: center; line-height: 1.2;
    }
    .logo-line-1 {
      color: var(--navy); font-weight: 800; font-size: 15px; letter-spacing: 0.08em; font-family: 'Poppins', sans-serif;
    }
    .logo-line-2 {
      color: var(--dark-green); font-weight: 600; font-size: 11.5px; display: flex; align-items: center; gap: 6px; margin-top: 2px; font-family: 'Poppins', sans-serif;
    }
    .logo-line-2 .pipe { color: var(--dark-green); font-weight: 400; opacity: 0.8; }

    /* Professional Avatar Styling */
    .consultant-avatar {
      width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #B3860C);
      color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900;
      margin: 0 auto 14px auto; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border: 3px solid rgba(255,255,255,0.2);
    }

    .nav-links { display: flex; align-items: center; gap: 20px; }
    .nav-links a { font-size: 13.5px; font-weight: 700; color: #425466; transition: 0.2s; }
    .nav-links a:hover { color: var(--navy); }
    
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      border: 0; border-radius: 11px; padding: 12px 18px; text-decoration: none;
      font-weight: 800; cursor: pointer; transition: 0.2s; white-space: nowrap;
    }
    .btn-dark { background: var(--navy); color: #fff; }
    .btn-whatsapp { background: var(--green); color: #063b1c; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(11,47,74,0.2); }

    /* Hero */
    .hero {
      padding: 70px 0 50px;
      background: radial-gradient(circle at 84% 20%, rgba(212,160,23,0.12), transparent 25%), linear-gradient(180deg, #F8FAFC 0%, #EDF4FA 100%);
    }
    .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; align-items: center; }
    .hero-lead { font-size: 17px; max-width: 600px; margin: 20px 0 25px; color: #536577; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    
    .trust-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .trust-pill {
      display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #425466;
      box-shadow: 0 5px 15px rgba(15,23,42,0.04);
    }
    .trust-pill b { color: var(--navy); }

    .hero-panel {
      background: var(--navy); border-radius: 22px; padding: 30px; color: #fff;
      box-shadow: 0 24px 60px rgba(11,47,74,0.18); text-align: center;
    }
    .hero-panel p { color: #B8C8D5; font-size: 13px; margin-top: 10px; }

    /* Remote Notice Banner */
    .remote-notice-banner {
      background: linear-gradient(135deg, #123F5E 0%, #0B2F4A 100%);
      color: #fff; padding: 14px 20px; text-align: center; font-size: 13.5px; font-weight: 600;
      border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    .remote-notice-banner span { color: var(--gold-light); font-weight: 700; }

    /* Sections */
    .section { padding: 80px 0; }
    .section-alt { background: var(--section-alt); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .section-light { background: var(--light); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .section-head { max-width: 750px; margin-bottom: 40px; }
    .section-head p { margin-top: 12px; font-size: 15px; }

    /* 9 Distinct Service Cards Layout */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .service-card {
      background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
      box-shadow: var(--shadow); transition: transform 0.25s, box-shadow 0.25s; display: flex; flex-direction: column; justify-content: space-between;
    }
    .service-card:hover { transform: translateY(-5px); box-shadow: 0 20px 45px rgba(11,47,74,0.12); border-color: var(--gold); }
    .service-num { font-size: 13px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .service-card h3 { font-size: 18px; margin-bottom: 10px; }
    .service-card p.eng { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .service-fee-tag { font-size: 12px; font-weight: 800; color: var(--navy); background: #F0F4F8; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; display: inline-block; }
    .service-card p.mar { font-size: 13.5px; color: var(--navy); font-weight: 600; border-top: 1px dashed var(--line); padding-top: 10px; background: #FFFDF4; padding: 10px; border-radius: 8px; }

    /* Info Sections */
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .info-box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); }
    .info-box h3 { font-size: 20px; margin-bottom: 15px; color: var(--navy); }
    .info-box p { font-size: 14px; margin-bottom: 12px; }
    .info-box p.mar { color: var(--navy); font-weight: 600; font-size: 15px; }

    /* Highlighted Refer & Earn Box */
    .highlight-referral-card {
      background: linear-gradient(135deg, #FFFDF0 0%, #FFF5CC 100%);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 35px;
      box-shadow: 0 15px 45px rgba(212,160,23,0.2);
      position: relative;
      overflow: hidden;
    }
    .highlight-referral-card:before {
      content: "★ EARN REWARDS";
      position: absolute; top: 15px; right: -30px; background: var(--gold); color: var(--navy);
      font-size: 10px; font-weight: 900; padding: 5px 35px; transform: rotate(45deg); letter-spacing: 0.1em;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Workflow Steps */
    .workflow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .workflow-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); position: relative; }
    .workflow-step { font-size: 12px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .workflow-card h3 { font-size: 16px; color: var(--navy); margin-bottom: 8px; }
    .workflow-card p { font-size: 13px; }

    /* Success Stories Grid */
    .success-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .success-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border-left: 4px solid var(--green); }
    .success-card h3 { font-size: 16px; color: var(--navy); margin-bottom: 8px; }
    .success-card p { font-size: 13px; }

    /* Checklist Grid */
    .checklist-grid { display: grid; grid-template-columns: repeat(2, 1fr);
